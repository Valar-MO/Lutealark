map $http_x_forwarded_proto $lutealark_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream lutealark_backend {
    server backend:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 256k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Keep API and health requests same-origin with the SPA. This preserves
    # the backend's HttpOnly/SameSite=Strict session cookie behavior.
    location /api/ {
        proxy_pass http://lutealark_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lutealark_forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 130s;
    }

    location = /api {
        proxy_pass http://lutealark_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lutealark_forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 130s;
    }

    location /trpc/ {
        proxy_pass http://lutealark_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lutealark_forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 130s;
    }

    location = /trpc {
        proxy_pass http://lutealark_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lutealark_forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 130s;
    }

    location ~ ^/health(?:/|$) {
        proxy_pass http://lutealark_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lutealark_forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
    }

    # React Router routes such as /cycle and /agent must be served by the SPA
    # entry point after a direct browser refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
