# HTTPS production overlay. The base compose file keeps the frontend private;
# Caddy is the only public entry point and obtains a certificate automatically.
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      LUTEALARK_DOMAIN: ${LUTEALARK_DOMAIN:?Set LUTEALARK_DOMAIN in deploy/.env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
