name: lutealark

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      target: migrate
    restart: "no"
    env_file:
      - .env.production
    environment:
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-lutealark}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production}@db:5432/${POSTGRES_DB:-lutealark}
      DATABASE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      target: runtime
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-lutealark}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production}@db:5432/${POSTGRES_DB:-lutealark}
      DATABASE_SSL: "false"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
